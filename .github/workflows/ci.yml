name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks and background runtime tests
        run: npm test
      - name: Package the extension
        run: |
          mkdir -p dist
          zip -qr "dist/LeakHalo-$(node -p "require('./manifest.json').version").zip" manifest.json background popup options welcome assets privacy.html privacy.css
      - uses: actions/upload-artifact@v4
        with:
          name: LeakHalo-extension
          path: dist/*.zip
